   year: 1969
   link: Rosenbaum1969.pdf
   description: >
        Classic paper describing the flagellum regrowth/shortening experiment.

 - pub:
   title: Mouvement brownien et grandeurs moléculaires
   authors: Jean Perrin
   year: 1909
   link: Perrin1909.pdf
   description: >
        Reports Brownian motion and the altitude distribution of particles in air, consistent with the Boltzmann distribution.

 - pub:
   title: Investigations on the Theory of the Brownian Movement
   authors: Albert Einstein
   year: 1906
   link: Einstein1906.pdf
   description: >
        Derivation of the vertical distribution of molecules in the atmosphere and key results on Brownian motion.

 - pub:
   title: Duration of urination does not change with body size
   authors: Patricia J. Yang, Jonathan Pham, Jerome Choo, and David L. Hu
   year: 2014
   link: Yang2014.pdf
   description: >
        Mammals heavier than ~3 kg have an approximately constant urination time (~21 ± 13 s):
        flow rate is gravity-dominated so T ≈ V/Q. For smaller mammals, capillary and viscous forces complicate the scaling.

