   title: Flagellar Length Control System, Testing a Simple Model Based on Intraflagellar Transport and Turnover
   authors: Wallace F. Marshall, Hongmin Qin, Monica Rodrigo Brenni, and Joel L. Rosenbaum
   year: 2005
   link: Marshall2005.pdf
   description: >
        Flagellum experiment: cut one of the two flagella and watch it regrow.
        The cut flagellum grows while the uncut one shrinks, until both reach the same length.

