- pub:
   title: Duration of urination does not change with body size
   authors: Patricia J. Yang, Jonathan Pham, Jerome Choo, and David L. Hua
   year: 2014
   link: Yang2014.pdf
   description: >
      Wild paper, everything is in the name. Mammal weighing more than 3kg have a constant peeing time (21+/-13s), because the flow rate out of the bladder (Q) is set my gravitational forces, this sets T~V/Q, with V the volume of the bladder and T the peeing time, pretty much constant. For smaller mammal, capillary forces and viscous forces make it more complicated.

